<html>
<head>
<title>program9:form validation</title>
<link rel="stylesheet" href="prgm9.css">
</head>
<body>
<legend>
<h1>FORM VALIDATION</h1></legend><br><br><fieldset>
<form name="form" action="" onsubmit="return validateForm()">
<label for ="name">Name:</label>
<select name="init" id="init">
	<option value="">Select</option>
	<option>Mr</option>
	<option>Mrs</option>
	<option>Ms</option>
</select>
<input type="text" id="name" name="name" placeholder="Enter Your Name"><br><br>
<label for="phone">Phone:</label>
<select>
	<option>+91</option>
	<option>+99</option>
	<option>+79</option>
</select>
<input type="tel" id="phone" name="phone" placeholder="Enter mobile number"><br><br>
<label for ="email">Email:</label>
<input type="email" id="email" name="email"  placeholder="Enter email"><br><br></fieldset>
<label for="address">Address:</label>
<textarea id="address" name="address" placeholder="Enter Your Address"></textarea>
<br><br>
<label for="gender">Gender:</label>
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
<br><br>

<label>Language Known:</label>
<input type="checkbox" name="language" value="English">English
<input type="checkbox" name="language" value="Malayalam">Malayalam
<input type="checkbox" name="language" value="Hindi">Hindi
<input type="checkbox" name="language" value="Tamil">Tamil
<br><br>
<label for="course">Course:</label>
<select>
	<option>MCA</option>
	<option>BCA</option>
	<option>BBA</option>
	<option>MBA</option>
</select><br><br>
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter Password">
<br><br>

<label for="confirm">Confirm Password:</label>
<input type="password" id="confirm" name="confirm" placeholder="Confirm Password">
<br><br>
<div>
<input type="Submit" id= "sub" value="Submit">
<input type="Reset" id="reset" value="Reset">
<div>
</form>
<script>
function validateForm()
{
	var name=document.form.name.value.trim();
	var phone=document.form.phone.value.trim();
	var email=document.form.email.value.trim();
	var address = document.form.address.value.trim();
	var password = document.form.password.value.trim();
	var confirm = document.form.confirm.value.trim();

	
	if (name=="") {
		alert("Enter Your Name");
		document.form.name.focus();
		return false;
	}
	else if (!/^[a-zA-Z ]+$/.test(name)){
		alert("Enter Valid Name");
		document.form.name.focus();
		return false;
	}
	
	if (phone=="") {
		alert("Enter Phone Number");
		document.form.phone.focus();
		return false;
	}
	else if(!/^[0-9]{10}$/.test(phone)) {
		alert("Enter valid 10 digit  mobile number");
		document.form.phone.focus();
		return false;
	}

	if (email =="") {
		alert("Enter your email");
		document.form.email.focus();
		return false;
	}
	else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
		alert("Enter Valid Email");
		document.form.email.focus();
		return false;
	}
	if (address == "") {
	    alert("Enter Your Address");
	    document.form.address.focus();
	    return false;
	}
	else if (!/^[a-zA-Z\s,.-]+$/.test(address)) {
	    alert("Address must contain letters only");
	    document.form.address.focus();
	    return false;
	}


	if (password == "") {
	    alert("Enter Your Password");
	    document.form.password.focus();
	    return false;
	}
	else if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,}$/.test(password)) {
	    alert("Password must contain minimum 8 characters, one uppercase letter, one lowercase letter, one 	    umber and one special character.");
	    document.form.password.focus();
	    return false;
	}

	if (confirm == "") {
	    alert("Confirm Your Password");
	    document.form.confirm.focus();
	    return false;
	}

	if (password !== confirm) {
	    alert("Password and Confirm Password Do Not Match");
	    document.form.confirm.focus();
	    return false;
	}

	alert("Form Submitted Successfully");
	return true;
}
</script>
	
</body>
<html>
